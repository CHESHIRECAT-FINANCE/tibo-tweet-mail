name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    # Python 3.9 has no build for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: node --check web/app.js && node test_web_model.js
